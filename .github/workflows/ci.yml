# Lint and the offline tests: no API key, no `api` or `integration` markers (pyproject's
# addopts leaves them out), so a run costs nothing and needs no dataset download.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # vendor/anp-mcp: the eval instrument the runner tests import
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
